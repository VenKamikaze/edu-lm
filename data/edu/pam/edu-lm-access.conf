# Edu-LM example: keep quiz users off the text consoles.
# Copy to /etc/security/access.d/50-edu-lm.conf to enable (see docs/INSTALL-ARCH.md).
#
# Only ttyN is listed. Never use ALL or LOCAL as the origin: SDDM logins are local
# too, and pam_access sees them as service "sddm", not as a tty.
-:(edu-students):tty1 tty2 tty3 tty4 tty5 tty6 tty7 tty8 tty9 tty10 tty11 tty12
